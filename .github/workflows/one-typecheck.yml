name: ONE Type Safety

on:
  pull_request:
    paths:
      - 'apps/one-mobile/**'
      - 'services/one-api/**'
      - 'api/one/**'
      - '.github/workflows/one-typecheck.yml'
  workflow_dispatch:

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/one-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/one-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
