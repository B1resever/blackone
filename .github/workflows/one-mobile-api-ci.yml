name: ONE Mobile and API CI

on:
  push:
    branches:
      - main
      - one-production-finish
    paths:
      - 'apps/one-mobile/**'
      - 'services/one-api/**'
      - 'api/one/**'
      - 'package.json'
      - '.github/workflows/one-mobile-api-ci.yml'
  pull_request:
    paths:
      - 'apps/one-mobile/**'
      - 'services/one-api/**'
      - 'api/one/**'
      - 'package.json'
      - '.github/workflows/one-mobile-api-ci.yml'

jobs:
  mobile:
    name: Mobile validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/one-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - run: npm install
      - run: npm run typecheck
      - run: npx expo-doctor

  api:
    name: API typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/one-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - run: npm install
      - run: npm run typecheck
