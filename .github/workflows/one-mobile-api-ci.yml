name: ONE Mobile and API CI

on:
  push:
    branches:
      - main
      - one-production-finish
    paths:
      - 'apps/one-mobile/**'
      - 'services/one-api/**'
      - 'api/one/**'
      - 'package.json'
      - '.github/workflows/one-mobile-api-ci.yml'
  pull_request:
    paths:
      - 'apps/one-mobile/**'
      - 'services/one-api/**'
      - 'api/one/**'
      - 'package.json'
      - '.github/workflows/one-mobile-api-ci.yml'

permissions:
  contents: read

jobs:
  mobile:
    name: Mobile validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/one-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run typecheck
      - run: npx --no-install expo-doctor
      - name: Export iOS and Android bundles
        env:
          EXPO_PUBLIC_ONE_API_URL: https://b1reserve.com
        run: npx --no-install expo export --platform all --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: one-mobile-bundles
          path: apps/one-mobile/dist
          retention-days: 7

  api:
    name: API validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/one-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: ${{ github.workspace }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run typecheck:routes
        working-directory: ${{ github.workspace }}
