name: ONE Preflight (no EAS build)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/one-mobile/**'
      - 'scripts/one-release-check.mjs'
      - 'scripts/one-production-smoke.mjs'
      - '.github/workflows/one-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/one-mobile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/one-mobile/package-lock.json
      - name: Validate release configuration and required files
        working-directory: ${{ github.workspace }}
        run: node scripts/one-release-check.mjs
      - name: Install locked mobile dependencies
        run: npm ci --ignore-scripts
      - name: Expo dependency compatibility
        run: npx --no-install expo-doctor
      - name: TypeScript mobile verification
        run: npm run typecheck
      - name: Production API smoke test (no payments or bookings)
        working-directory: ${{ github.workspace }}
        run: node scripts/one-production-smoke.mjs
