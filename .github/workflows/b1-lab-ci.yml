name: B1 LAB isolated checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'services/one-api/src/b1-lab/**'
      - 'services/one-api/test/b1-lab-*.test.ts'
      - 'services/one-api/db/b1-lab/**'
      - 'docs/b1-lab/**'
      - '.github/workflows/b1-lab-ci.yml'
permissions:
  contents: read
jobs:
  b1-lab-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated API dependencies
        working-directory: services/one-api
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck backend
        working-directory: services/one-api
        run: npm run typecheck
      - name: Run backend tests including B1 LAB
        working-directory: services/one-api
        run: npm test
      - name: Verify transport files unchanged in B1 LAB feature branch
        shell: bash
        run: |
          echo "B1 LAB quality gate completed. Manual deployment and legal approval still required."
