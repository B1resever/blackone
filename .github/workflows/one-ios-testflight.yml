name: ONE iOS TestFlight Build

on:
  workflow_dispatch:
    inputs:
      submit_to_testflight:
        description: 'Submit completed store build to TestFlight (requires App Store Connect credentials)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: one-ios-testflight
  cancel-in-progress: false

jobs:
  ios:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/one-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Expo credential is configured
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Set repository secret EXPO_TOKEN before building ONE."
            exit 1
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Verify EAS linkage
        run: |
          node -e "const c=require('./app.json').expo; if(!c.extra?.eas?.projectId) { console.error('Missing expo.extra.eas.projectId: run eas init and commit the project ID.'); process.exit(1) }"
      - name: Verify Apple signing setup and queue iOS store build
        run: eas build --platform ios --profile production --non-interactive --no-wait
      - name: TestFlight submission instructions
        if: ${{ inputs.submit_to_testflight }}
        run: |
          echo "::notice::Build queued. Submit only after EAS reports a completed, signed IPA: eas submit --platform ios --profile production --latest --non-interactive"
          echo "::notice::This workflow does not auto-submit an unfinished build."
