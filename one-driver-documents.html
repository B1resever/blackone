<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ONE Driver Compliance · BLACK ONE</title>
<style>
:root{--bg:#02080e;--panel:#07131d;--line:#173747;--cyan:#00eaf0;--text:#f7fbff;--muted:#90a4b3;--bad:#ff6b7a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,Arial,sans-serif}
header{padding:18px 24px;border-bottom:1px solid var(--line)}main{padding:22px;max-width:1500px;margin:auto}
h1{margin:0}.cyan{color:var(--cyan)}.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin-bottom:16px}
input,button{background:#0b1c28;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px}
button{cursor:pointer;font-weight:800}.primary{background:var(--cyan);color:#001217;border-color:var(--cyan)}.reject{border-color:var(--bad);color:var(--bad)}
table{width:100%;border-collapse:collapse;background:var(--panel)}th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--cyan);font-size:11px}.muted{color:var(--muted)}.grid{overflow:auto}.status{text-transform:uppercase;font-weight:900}.actions{display:flex;gap:6px;flex-wrap:wrap}
a{color:var(--cyan)}
@media(max-width:800px){.controls{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1><span class="cyan">ONE</span> Driver Compliance · BLACK ONE</h1></header>
<main>
<div class="controls">
<input id="api" placeholder="ONE API base URL">
<input id="token" type="password" placeholder="Admin token">
<button id="load" class="primary">LOAD DOCUMENTS</button>
</div>
<div class="grid">
<table>
<thead><tr><th>DRIVER</th><th>DOCUMENT</th><th>NUMBER</th><th>EXPIRES</th><th>FILE</th><th>STATUS</th><th>ACTIONS</th></tr></thead>
<tbody id="rows"><tr><td colspan="7" class="muted">Connect ONE API to review driver compliance.</td></tr></tbody>
</table>
</div>
</main>
<script>
const $=s=>document.querySelector(s),api=$('#api'),token=$('#token'),rows=$('#rows');
api.value=sessionStorage.getItem('one_api')||location.origin;token.value=sessionStorage.getItem('one_token')||'';
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function request(path,options={}){const base=api.value.replace(/\/$/,'');const headers={...(options.headers||{}),'Content-Type':'application/json','Authorization':'Bearer '+token.value};const r=await fetch(base+path,{...options,headers});if(!r.ok)throw new Error(await r.text());return r.json()}
function render(list){rows.innerHTML=list.map(d=>`<tr>
<td><b>${esc(d.full_name)}</b><div class="muted">${esc(d.email)}</div></td>
<td>${esc(d.document_type)}</td>
<td>${esc(d.document_number||'—')}</td>
<td>${esc(d.expires_on||'—')}</td>
<td>${d.has_file?'<button onclick="openFile(\''+esc(d.id)+'\')">Open '+esc(d.file_name||'document')+'</button>':'No uploaded file'}</td>
<td class="status">${esc(d.status)}</td>
<td><div class="actions"><button onclick="review('${esc(d.id)}','approved')">Approve</button><button class="reject" onclick="review('${esc(d.id)}','rejected')">Reject</button></div></td>
</tr>`).join('')}
async function load(){sessionStorage.setItem('one_api',api.value);sessionStorage.setItem('one_token',token.value);try{const d=await request('/one/api/admin-driver-documents');render(d.documents||[])}catch{rows.innerHTML='<tr><td colspan="7" class="muted">Unable to load. Check API URL and admin token.</td></tr>'}}
async function openFile(documentId){
  try{
    const d=await request('/one/api/admin-driver-document-file?documentId='+encodeURIComponent(documentId));
    const binary=atob(d.base64);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
    const blob=new Blob([bytes],{type:d.content_type||'application/octet-stream'});
    const url=URL.createObjectURL(blob);
    window.open(url,'_blank','noopener');
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch{alert('Unable to open document')}
}
async function review(documentId,status){
  try{
    await request('/one/api/admin-driver-documents',{method:'POST',body:JSON.stringify({documentId,status,reviewNotes:''})});
    await load()
  }catch(e){
    const message=String(e&&e.message||'');
    alert(message.includes('document_file_required')?'Upload file required before approval.':'Review failed')
  }
}
$('#load').addEventListener('click',load);
</script>
</body></html>
